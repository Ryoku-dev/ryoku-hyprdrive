# The build recipe `ryoku-hub desktop plugins rebuild` runs, in the format hyprpm
# reads. Ryoku builds this repository's ryoku branch, which tracks the Hyprland
# Ryoku ships, so it carries no commit pins. The look bridge (look/) is built by
# the package (`make look`), not here: the plugin finds it on PATH.

[repository]
name = "ryoku-hyprdrive"
authors = ["Ryoku", "dragos", "yayuuu"]
description = "Mission-control overview, Mosaic and window motion for Ryoku"
commit_pins = []

[hyprdrive]
description = "Mission-control overview, Mosaic and window motion"
output = "hyprdrive.so"
build = ["make hyprdrive.so"]
